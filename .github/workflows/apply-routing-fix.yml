name: Apply routing fix
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[routing-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply base-aware routing
        run: python3 scripts/professional_route_patch.py
      - name: Verify source
        run: |
          grep -q 'const base="/DevBox/"' src/main.jsx
          grep -q '/DevBox/tools/' src/main.jsx
      - name: Commit routing fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.jsx
          git diff --cached --quiet || git commit -m "fix: make tool routes GitHub Pages safe [routing-fix]"
          git push
